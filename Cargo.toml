[package]
name = "datafusion-jc"
version = "0.1.0"
edition = "2024"
description = "Embeddable DataFusion catalog implementation serialized to JSON format"
authors = ["Devan Benz <devandbenz@gmail.com>"]

[dependencies]
async-trait = "0.1.92"
dashmap = "6.2.1"
datafusion = { version = "55.1.0", features = ["serde", "parquet"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
typetag = "0.2.23"

[dev-dependencies]
tempfile = "3.27.0"
